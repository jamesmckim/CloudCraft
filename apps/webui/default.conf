# /webui/default.conf
server {
    listen 80;
    server_name localhost;

    location /config.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        sendfile off;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}