apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: craftcloud-system

generators:
  - ksops-generator.yaml

helmCharts:
  - name: redis
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 25.3.12
    releaseName: redis-broker
    namespace: craftcloud-system
    valuesFile: values/redis-values.yaml