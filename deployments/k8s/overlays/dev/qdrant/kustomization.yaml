apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: craftcloud-system

generators:
  - ksops-generator.yaml

helmCharts:
  - name: qdrant
    repo: https://qdrant.github.io/qdrant-helm
    version: 1.18.0
    releaseName: qdrant
    namespace: craftcloud-system
    valuesFile: values/qdrant-values.yaml