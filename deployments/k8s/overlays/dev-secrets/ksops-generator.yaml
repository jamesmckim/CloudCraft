apiVersion: viaduct.ai/v1
kind: ksops.exe
metadata:
  name: ksops-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: /usr/local/bin/ksops
files:
  - identity-secret.sops.yaml
  - fleet-secret.sops.yaml
  - telemetry-secret.sops.yaml
  - postgres-secret.sops.yaml
  - redis-secret.sops.yaml
  - qdrant-secret.sops.yaml
  - keycloak-secret.sops.yaml