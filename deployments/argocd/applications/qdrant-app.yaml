apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/jamesmckim/CloudCraft.git'
      targetRevision: main
      path: deployments/k8s/overlays/dev/qdrant

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: craftcloud-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true